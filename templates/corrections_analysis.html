<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Corrections analysis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 20px; color: #0A1F44; }
    .back-link { margin-bottom: 12px; }
    .back-link a { color: #1B5DBF; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    h2 {
      color: #0A1F44;
      margin-bottom: 4px;
    }
    .filters-block-wrap {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .filters-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .filters-block-title {
      font-size: 14px;
      font-weight: 600;
      color: #0A1F44;
      margin: 0;
    }
    .filters-block-header button {
      background: #e0e4ec;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #0A1F44;
    }
    .filters-block-header button:hover {
      background: #d0d6e6;
    }
    .filters-block-wrap .filters {
      margin-bottom: 0;
      padding: 0;
    }
    .pagination {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .pagination button {
      background: #1B5DBF;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
    }
    .pagination button:hover:not(:disabled) { background: #3A7DD3; }
    .pagination button:disabled { background: #999; cursor: not-allowed; }
    .pagination span { font-weight: 600; }
    .app-version-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e0e4ec;
      font-size: 12px;
      color: #6b7280;
    }
    .table-wrap { overflow-x: auto; }
    .results-actions {
      margin: 0 0 12px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .results-actions button {
      background: #1B5DBF;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .results-actions button:hover:not(:disabled) { background: #3A7DD3; }
    .results-actions button:disabled { background: #999; cursor: not-allowed; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
      box-sizing: border-box;
    }
    .modal-box {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      max-width: 460px;
      width: 100%;
      padding: 16px 18px;
    }
    .modal-title {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 600;
      color: #0A1F44;
    }
    .modal-text {
      margin: 0;
      color: #334155;
      font-size: 14px;
      line-height: 1.4;
    }
    .modal-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }
    .modal-actions button {
      background: #1B5DBF;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 7px 12px;
      cursor: pointer;
    }
    .modal-actions button:hover {
      background: #3A7DD3;
    }
    table {
      border-collapse: separate;
      border-spacing: 6px;
      width: 100%;
      margin-top: 8px;
      background: #f0f2f5;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    th { background: #0A1F44; color: white; position: sticky; top: 0; z-index: 2; white-space: nowrap; border-color: #0A1F44; }
    tbody tr:nth-child(even) td { background-color: #f8faff; }
    tbody tr:hover td { background-color: #e6f0ff; }
    #loading { margin: 6px 0 8px 0; color: #666; }
    #error { margin: 16px 0; color: #c00; }
    .filters {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      row-gap: 12px;
      column-gap: 32px;
      align-items: end;
    }
    .filters label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; color: #0A1F44; }
    .filters input,
    .filters select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      background: white;
      font-size: 14px;
    }
    .filter-count { margin: 12px 0; font-weight: 600; color: #0A1F44; }
    .filters-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .filters-toolbar button {
      background: #e0e4ec;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #0A1F44;
    }
    .filters-toolbar button:hover {
      background: #d0d6e6;
    }
    .filter-field {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .filter-clear {
      background: #f0f2f5;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      color: #555;
      white-space: nowrap;
    }
    .filter-clear:hover {
      background: #e2e6f0;
    }

    /* Filter container width – unified for all filters */
    .filter-container {
      width: 245px;
      box-sizing: border-box;
    }
    .logistics-count {
      margin-top: 4px;
      font-size: 11px;
      color: #555;
      line-height: 1.2;
    }
    /* Forcing a break between rows inside the game filters grid */
    #game-filters .filters-row-break {
      grid-column: 1 / -1;
      height: 0;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="back-link"><a href="/">← Home</a> · <a href="/uscs-analysis">USCs analysis</a></div>
<h2>Corrections analysis</h2>

<div id="loading">Loading…</div>
<div id="error" style="display:none;"></div>

<div class="filters-block-wrap">
  <div class="filters-block-header">
    <h3 class="filters-block-title">Game filters</h3>
    <button type="button" id="clear-game-filters">Clear game filters</button>
  </div>
  <div class="filters" id="game-filters">
  <div class="filter-container filter-container-competition">
    <label for="filter-competition">competition</label>
    <div class="filter-field">
      <input type="text" id="filter-competition" class="filter-competition" list="datalist_competition" placeholder="All competitions">
      <button type="button" class="filter-clear" data-col="competition">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-season">
    <label for="filter-season">season</label>
    <div class="filter-field">
      <input type="text" id="filter-season" class="filter-season" list="datalist_season" placeholder="All seasons">
      <button type="button" class="filter-clear" data-col="season">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-phase">
    <label for="filter-phase">phase</label>
    <div class="filter-field">
      <input type="text" id="filter-phase" class="filter-phase" list="datalist_phase" placeholder="Regular season or postseason">
      <button type="button" class="filter-clear" data-col="phase">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-group">
    <label for="filter-group">group</label>
    <div class="filter-field">
      <input type="text" id="filter-group" class="filter-group" list="datalist_group" placeholder="A or B (Eurocup)">
      <button type="button" class="filter-clear" data-col="group">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-game_code">
    <label for="filter-game_code">game_code</label>
    <div class="filter-field">
      <input type="text" id="filter-game_code" class="filter-game-code" placeholder="Ex: E2025_130">
      <button type="button" class="filter-clear" data-col="game_code">Clear</button>
    </div>
  </div>

  <!-- Row 1: home/away teams and USCs -->
  <div class="filter-container filter-container-home_team">
    <label for="filter-home_team">home_team (team code)</label>
    <div class="filter-field">
      <input type="text" id="filter-home_team" list="datalist_team_codes" placeholder="All home teams">
      <button type="button" class="filter-clear" data-col="home_team">Clear</button>
    </div>
  </div>

  <div class="filter-container filter-container-away_team">
    <label for="filter-away_team">away_team (team code)</label>
    <div class="filter-field">
      <input type="text" id="filter-away_team" list="datalist_team_codes" placeholder="All away teams">
      <button type="button" class="filter-clear" data-col="away_team">Clear</button>
    </div>
  </div>

  <div class="filter-container filter-container-data_entry">
    <label for="filter-data_entry">data_entry</label>
    <div class="filter-field">
      <input type="text" id="filter-data_entry" list="datalist_data_entry" placeholder="All data entries">
      <button type="button" class="filter-clear" data-col="data_entry">Clear</button>
    </div>
  </div>

  <div class="filter-container filter-container-caller_1">
    <label for="filter-caller_1">caller_1</label>
    <div class="filter-field">
      <input type="text" id="filter-caller_1" list="datalist_caller_1" placeholder="All caller 1">
      <button type="button" class="filter-clear" data-col="caller_1">Clear</button>
    </div>
  </div>

  <div class="filter-container filter-container-caller_2">
    <label for="filter-caller_2">caller_2</label>
    <div class="filter-field">
      <input type="text" id="filter-caller_2" list="datalist_caller_2" placeholder="All caller 2">
      <button type="button" class="filter-clear" data-col="caller_2">Clear</button>
    </div>
  </div>

  <div class="filter-container filter-container-timer">
    <label for="filter-timer">timer</label>
    <div class="filter-field">
      <input type="text" id="filter-timer" list="datalist_timer" placeholder="All timers">
      <button type="button" class="filter-clear" data-col="timer">Clear</button>
    </div>
  </div>

  <div class="filter-container filter-container-shot_clock_operator">
    <label for="filter-shot_clock_operator">shot_clock_operator</label>
    <div class="filter-field">
      <input type="text" id="filter-shot_clock_operator" list="datalist_shot_clock_operator" placeholder="All shot clock operators">
      <button type="button" class="filter-clear" data-col="shot_clock_operator">Clear</button>
    </div>
  </div>

  <div class="filter-container filter-container-irs_operator">
    <label for="filter-irs_operator">irs_operator</label>
    <div class="filter-field">
      <input type="text" id="filter-irs_operator" list="datalist_irs_operator" placeholder="All IRS operators">
      <button type="button" class="filter-clear" data-col="irs_operator">Clear</button>
    </div>
  </div>

  <!-- Force new grid row for logistics -->
  <div class="filters-row-break"></div>

  <!-- Row 2: logistics -->
  <div class="filter-container filter-container-arrival_time">
    <label for="filter-arrival_time">arrival_time</label>
    <div class="filter-field">
      <input type="text" id="filter-arrival_time" list="datalist_arrival_time" placeholder="All">
      <button type="button" class="filter-clear" data-col="arrival_time">Clear</button>
    </div>
    <div class="logistics-count" id="logistics-count-arrival_time"></div>
  </div>

  <div class="filter-container filter-container-checklist_on_time">
    <label for="filter-checklist_on_time">checklist_on_time</label>
    <div class="filter-field">
      <input type="text" id="filter-checklist_on_time" list="datalist_checklist_on_time" placeholder="All">
      <button type="button" class="filter-clear" data-col="checklist_on_time">Clear</button>
    </div>
    <div class="logistics-count" id="logistics-count-checklist_on_time"></div>
  </div>

  <div class="filter-container filter-container-communication">
    <label for="filter-communication">communication</label>
    <div class="filter-field">
      <input type="text" id="filter-communication" list="datalist_communication" placeholder="All">
      <button type="button" class="filter-clear" data-col="communication">Clear</button>
    </div>
    <div class="logistics-count" id="logistics-count-communication"></div>
  </div>

  <div class="filter-container filter-container-corrections_speed">
    <label for="filter-corrections_speed">corrections_speed</label>
    <div class="filter-field">
      <input type="text" id="filter-corrections_speed" list="datalist_corrections_speed" placeholder="All">
      <button type="button" class="filter-clear" data-col="corrections_speed">Clear</button>
    </div>
    <div class="logistics-count" id="logistics-count-corrections_speed"></div>
  </div>

  <div class="filter-container filter-container-rescouted">
    <label for="filter-rescouted">rescouted</label>
    <div class="filter-field">
      <input type="text" id="filter-rescouted" list="datalist_rescouted" placeholder="All">
      <button type="button" class="filter-clear" data-col="rescouted">Clear</button>
    </div>
    <div class="logistics-count" id="logistics-count-rescouted"></div>
  </div>
</div>
</div>

<div class="filters-block-wrap">
  <div class="filters-block-header">
    <h3 class="filters-block-title">Correction filters</h3>
    <button type="button" id="clear-corrections-filters">Clear corrections filters</button>
  </div>
  <div class="filters" id="filters">
  <div class="filter-container filter-container-time">
    <label for="filter-time">time</label>
    <div class="filter-field">
      <input type="text" id="filter-time" class="filter-time" placeholder="Ex: 05:34">
      <button type="button" class="filter-clear" data-col="time">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-quarter">
    <label for="filter-quarter">quarter</label>
    <div class="filter-field">
      <input type="text" id="filter-quarter" class="filter-quarter" list="quarter_list">
      <button type="button" class="filter-clear" data-col="quarter">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-points_h">
    <label for="filter-points_h">points_h</label>
    <div class="filter-field">
      <input type="text" id="filter-points_h" class="filter-points-h" placeholder="Ex: 45">
      <button type="button" class="filter-clear" data-col="points_h">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-points_a">
    <label for="filter-points_a">points_a</label>
    <div class="filter-field">
      <input type="text" id="filter-points_a" class="filter-points-a" placeholder="Ex: 42">
      <button type="button" class="filter-clear" data-col="points_a">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-action_num">
    <label for="filter-action_num">action_num</label>
    <div class="filter-field">
      <input type="text" id="filter-action_num" class="filter-action-num" placeholder="Ex: 12">
      <button type="button" class="filter-clear" data-col="action_num">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-b_ss">
    <label for="filter-b_ss">b_ss</label>
    <div class="filter-field">
      <input type="text" id="filter-b_ss" class="filter-b-ss" list="bss_list">
      <button type="button" class="filter-clear" data-col="b_ss">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-team">
    <label for="filter-team">team</label>
    <div class="filter-field">
      <input type="text" id="filter-team" class="filter-team" list="team_list">
      <button type="button" class="filter-clear" data-col="team">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-type_c">
    <label for="filter-type_c">type_c</label>
    <div class="filter-field">
      <input type="text" id="filter-type_c" class="filter-type-c" list="typec_list">
      <button type="button" class="filter-clear" data-col="type_c">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-category">
    <label for="filter-category">category</label>
    <div class="filter-field">
      <input type="text" id="filter-category" class="filter-category" list="category_list">
      <button type="button" class="filter-clear" data-col="category">Clear</button>
    </div>
  </div>
  <div class="filter-container filter-container-live_game_manager">
    <label for="filter-live_game_manager">live_game_manager</label>
    <div class="filter-field">
      <input type="text" id="filter-live_game_manager" class="filter-live-game-manager" list="datalist_live_game_manager" placeholder="All Live Game Managers">
      <button type="button" class="filter-clear" data-col="live_game_manager">Clear</button>
    </div>
  </div>
</div>
</div>
<p class="filter-count" id="filter-count" style="display:none;">
  <span id="filter-count-text"></span>
  <span id="filter-percent-text" style="margin-left: 12px;"></span>
  <span id="filter-games-text" style="margin-left: 12px;"></span>
</p>
<div class="results-actions" id="results-actions" style="display:none;">
  <button type="button" id="export-corrections-excel">Export corrections types results</button>
  <button type="button" id="export-bss-excel">Export boxscore/scoresheet results</button>
  <button type="button" id="export-quarter-excel">Export corrections by quarter results</button>
  <button type="button" id="export-team-excel">Export corrections by team results</button>
  <button type="button" id="export-category-excel">Export corrections by category results</button>
  <button type="button" id="export-type-category-excel">Export type_c/category tables</button>
  <button type="button" id="export-lgm-excel">Export corrections by live game manager results</button>
</div>

<!-- Datalists for game/logistics filters (options + free text) -->
<datalist id="datalist_team_codes"></datalist>
<datalist id="datalist_data_entry"></datalist>
<datalist id="datalist_caller_1"></datalist>
<datalist id="datalist_caller_2"></datalist>
<datalist id="datalist_timer"></datalist>
<datalist id="datalist_shot_clock_operator"></datalist>
<datalist id="datalist_irs_operator"></datalist>
<datalist id="datalist_arrival_time">
  <option value="OK"></option>
  <option value="LATE"></option>
</datalist>

  <option value="YES"></option>
  <option value="NO"></option>
</datalist>

  <option value="GOOD"></option>
  <option value="OK"></option>

</datalist>

</datalist>

</datalist>

</datalist>

  <option value="postseason"></option>
</datalist>
<datalist id="datalist_group">
  <option value="A"></option>
  <option value="B"></option>
</datalist>
<datalist id="datalist_live_game_manager"></datalist>

<div class="table-wrap" id="table-wrap" style="display:none;">
  <table id="table">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="pagination" id="pagination">
    <button type="button" id="btn-first">First</button>
    <button type="button" id="btn-prev">Previous</button>
    <span id="page-info"></span>
    <button type="button" id="btn-next">Next</button>
    <button type="button" id="btn-last">Last</button>
  </div>
</div>

<div class="modal-backdrop" id="export-warning-modal" style="display:none;">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="export-warning-title">
    <h3 class="modal-title" id="export-warning-title">No corrections found</h3>
    <p class="modal-text">There are no corrections matching the selected options. Adjust the filters and try again.</p>
    <div class="modal-actions">
      <button type="button" id="close-export-warning">Close</button>
    </div>
  </div>
</div>

<script>
const PER_PAGE = 10;
const displayColumns = [
  "game_code", "time", "quarter", "points_h", "points_a", "action_num",
  "b_ss", "team", "type_c", "category", "thread_name", "correction", "live_game_manager"
];
const filterableColumns = [
  "game_code", "time", "quarter", "points_h", "points_a", "action_num",
  "b_ss", "team", "type_c", "category", "live_game_manager"
];
// filters that live in the Game table (home/away, USCs, logistics)
const gameFilterColumns = [
  "group",
  "home_team", "away_team",
  "data_entry", "caller_1", "caller_2", "timer",
  "shot_clock_operator", "irs_operator",
  "arrival_time", "checklist_on_time", "communication",
  "corrections_speed", "rescouted"
];
const extraFilterColumns = ["competition", "season", "phase"];
const gameTopFilterColumns = ["competition", "season", "phase", "group", "game_code"];

let currentPage = 1;
let totalPages = 0;
let total = 0;
let totalGames = 0;
let teamCodeToName = {};
let selectedFilterOrder = [];

function showLoading(show) {
  document.getElementById("loading").style.display = show ? "block" : "none";
}
function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
}
function showTable(show) {
  document.getElementById("table-wrap").style.display = show ? "block" : "none";
}
function showFilterCount(show) {
  const el = document.getElementById("filter-count");
  el.style.display = show ? "block" : "none";
  const actionsEl = document.getElementById("results-actions");
  if (actionsEl) actionsEl.style.display = show ? "block" : "none";
}

function showExportWarningModal(show) {
  const modal = document.getElementById("export-warning-modal");
  if (!modal) return;
  modal.style.display = show ? "flex" : "none";
}

function getFilterParams() {
  const params = new URLSearchParams({ page: String(currentPage), per_page: String(PER_PAGE) });
  // standard equality filters
  filterableColumns.forEach(col => {
    const input = document.getElementById("filter-" + col);
    if (input && input.value.trim()) params.set(col, input.value.trim());
  });
  // game-level filters (Game table)
  gameFilterColumns.forEach(col => {
    const input = document.getElementById("filter-" + col);
    if (input && input.value.trim()) params.set(col, input.value.trim());
  });

  // extra virtual filters (competition, season)
  const competitionEl = document.getElementById("filter-competition");
  if (competitionEl && competitionEl.value) {
    params.set("competition", competitionEl.value);
  }
  const seasonEl = document.getElementById("filter-season");
  if (seasonEl && seasonEl.value) {
    params.set("season", seasonEl.value);
  }
  const phaseEl = document.getElementById("filter-phase");
  if (phaseEl && phaseEl.value) {
    params.set("phase", phaseEl.value);
  }
  return params;
}

function getCurrentFilterValue(col) {
  const el = document.getElementById("filter-" + col);
  return el ? el.value.trim() : "";
}

function trackFilterSelection(col) {
  const v = getCurrentFilterValue(col);
  selectedFilterOrder = selectedFilterOrder.filter(c => c !== col);
  if (v) selectedFilterOrder.push(col);
}

function getActiveSelectedOrder() {
  return selectedFilterOrder.filter(col => !!getCurrentFilterValue(col));
}

function buildParamsFromColumns(columns) {
  const params = new URLSearchParams({ page: "1", per_page: "1" });
  columns.forEach(col => {
    const v = getCurrentFilterValue(col);
    if (v) params.set(col, v);
  });
  return params;
}

function fetchCountForColumns(columns) {
  const params = buildParamsFromColumns(columns);
  return fetch("/api/corrections?" + params.toString())
    .then(r => r.json())
    .then(data => Number(data.total || 0));
}

function fetchPage(page) {
  currentPage = page;
  showLoading(true);
  showError("");
  const params = getFilterParams();
  params.set("page", String(page));
  fetch("/api/corrections?" + params)
    .then(r => r.json())
    .then(async data => {
      showLoading(false);
      total = data.total;
      totalGames = data.total_games || 0;
      totalPages = data.total_pages;
      currentPage = data.page;
      renderTable(data.items);
      renderPagination();

      const activeOrder = getActiveSelectedOrder();
      let denom = 0;
      let scopeLabel = "total corrections";
      if (activeOrder.length <= 1) {
        denom = await fetchCountForColumns([]);
      } else {
        const prevSelected = activeOrder.slice(0, activeOrder.length - 1);
        denom = await fetchCountForColumns(prevSelected);
        scopeLabel = "records matching previous selected filters";
      }
      const pct = denom ? (Number(total) / Number(denom)) * 100 : 0;
      renderFilterCount({
        denom_total: denom,
        percent_of_total: pct,
        scope_label: scopeLabel,
      });
      showTable(true);
      showFilterCount(true);
    })
    .catch(err => {
      showLoading(false);
      showError("Error loading data: " + err.message);
      showTable(false);
      showFilterCount(false);
    });
}

function renderFilterCount(extra) {
  const countEl = document.getElementById("filter-count-text");
  const gamesEl = document.getElementById("filter-games-text");
  const pctEl = document.getElementById("filter-percent-text");
  if (countEl) {
    countEl.textContent = "Number of records with selected filters: " + total;
  }
  if (gamesEl) {
    gamesEl.textContent = "Games with selected filters: " + totalGames;
  }
  if (!pctEl) return;
  if (!extra || !extra.denom_total) {
    pctEl.textContent = "";
    return;
  }
  const pct = typeof extra.percent_of_total === "number"
    ? extra.percent_of_total
    : 0;
  pctEl.textContent = `${pct.toFixed(1)}% of ${extra.scope_label || "total corrections"}`;
}

function renderTable(items) {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "";
  tbody.innerHTML = "";

  const headerRow = document.createElement("tr");
  displayColumns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);

  items.forEach(row => {
    const tr = document.createElement("tr");
    displayColumns.forEach(col => {
      const td = document.createElement("td");
      const val = row[col];
      td.textContent = val != null && val !== "" ? String(val) : "";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function renderPagination() {
  document.getElementById("page-info").textContent =
    "Page " + currentPage + " of " + (totalPages || 1) + " (" + total + " total records)";
  document.getElementById("btn-first").disabled = currentPage <= 1;
  document.getElementById("btn-prev").disabled = currentPage <= 1;
  document.getElementById("btn-next").disabled = currentPage >= totalPages || totalPages === 0;
  document.getElementById("btn-last").disabled = currentPage >= totalPages || totalPages === 0;
}

function clearFilter(col) {
  const el = document.getElementById("filter-" + col);
  if (!el) return;
  if (el.tagName === "SELECT") {
    el.value = "";
  } else {
    el.value = "";
  }
}

function normalizeGroupValue(rawValue) {
  const value = (rawValue || "").trim().toUpperCase();
  return (value === "A" || value === "B") ? value : "";
}

function normalizePhaseValue(rawValue) {
  const normalized = (rawValue || "").trim().toLowerCase();
  if (normalized === "regular season" || normalized === "postseason") return normalized;
  return "";
}

function syncPhaseFilterState() {
  const competitionEl = document.getElementById("filter-competition");
  const phaseEl = document.getElementById("filter-phase");
  const phaseClearBtn = document.querySelector('.filter-clear[data-col="phase"]');
  if (!competitionEl || !phaseEl) return;

  const competition = (competitionEl.value || "").trim().toUpperCase();
  if (!competition) {
    phaseEl.value = "";
    phaseEl.disabled = true;
    if (phaseClearBtn) phaseClearBtn.disabled = true;
    selectedFilterOrder = selectedFilterOrder.filter(c => c !== "phase");
    return;
  }

  phaseEl.disabled = false;
  if (phaseClearBtn) phaseClearBtn.disabled = false;
  phaseEl.value = normalizePhaseValue(phaseEl.value);
}

function syncGroupFilterState() {
  const competitionEl = document.getElementById("filter-competition");
  const groupEl = document.getElementById("filter-group");
  const groupClearBtn = document.querySelector('.filter-clear[data-col="group"]');
  if (!competitionEl || !groupEl) return;

  const competition = (competitionEl.value || "").trim().toUpperCase();
  if (competition !== "U") {
    groupEl.value = "";
    groupEl.disabled = true;
    if (groupClearBtn) groupClearBtn.disabled = true;
    selectedFilterOrder = selectedFilterOrder.filter(c => c !== "group");
    return;
  }

  groupEl.disabled = false;
  if (groupClearBtn) groupClearBtn.disabled = false;
  groupEl.value = normalizeGroupValue(groupEl.value);
}

function loadFilterLiveGameManagers() {
  const datalist = document.getElementById("datalist_live_game_manager");
  if (!datalist) return;
  fetch("/get_live_game_managers")
    .then(r => r.json())
    .then(data => {
      datalist.innerHTML = "";
      data.forEach(lgm => {
        const option = document.createElement("option");
        option.value = lgm;
        datalist.appendChild(option);
      });
    })
    .catch(() => {
      datalist.innerHTML = "";
    });
}

function loadTeamCodes() {
  const datalist = document.getElementById("datalist_team_codes");
  if (!datalist) return;
  fetch("/api/teams")
    .then(r => r.json())
    .then(data => {
      datalist.innerHTML = "";
      teamCodeToName = {};
      data.forEach(row => {
        const code = row.team_code;
        const name = row.team_name;
        if (code) teamCodeToName[code] = name || "";
        const opt = document.createElement("option");
        opt.value = code;
        datalist.appendChild(opt);
      });
    });
}

function loadAllUscs() {
  const datalistIds = [
    "datalist_data_entry",
    "datalist_caller_1",
    "datalist_caller_2",
    "datalist_timer",
    "datalist_shot_clock_operator",
    "datalist_irs_operator",
  ];
  datalistIds.forEach(id => {
    const datalist = document.getElementById(id);
    if (!datalist) return;
    datalist.innerHTML = "";
  });
  fetch("/api/uscs")
    .then(r => r.json())
    .then(names => {
      datalistIds.forEach(id => {
        const datalist = document.getElementById(id);
        if (!datalist) return;
        names.forEach(name => {
          const opt = document.createElement("option");
          opt.value = name;
          datalist.appendChild(opt);
        });
      });
    });
}

function updateLogisticsCounts() {
  const params = new URLSearchParams();
  gameFilterColumns.forEach(col => {
    const el = document.getElementById("filter-" + col);
    if (el && el.value.trim()) {
      params.set(col, el.value.trim());
    }
  });
  fetch("/api/logistics_counts?" + params.toString())
    .then(r => r.json())
    .then(data => {
      // helper to render % under each logistics filter (over total for that field)
      function renderCounts(containerId, fieldName, orderedValues) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const counts = data[fieldName] || {};
        let total = 0;
        Object.values(counts).forEach(c => { total += c; });
        if (!Object.keys(counts).length || total === 0) {
          container.textContent = "";
          return;
        }
        const parts = [];
        orderedValues.forEach(v => {
          const c = counts[v] || 0;
          const pct = Math.round((c / total) * 100);
          parts.push(`${v}: ${pct}%`);
        });
        container.textContent = parts.join(" · ") + (total ? `   (${total})` : "");
      }

      renderCounts("logistics-count-arrival_time", "arrival_time", ["OK", "LATE"]);
      renderCounts("logistics-count-checklist_on_time", "checklist_on_time", ["YES", "NO"]);
      renderCounts("logistics-count-communication", "communication", ["GOOD", "OK", "NOT FLUID"]);
      renderCounts("logistics-count-corrections_speed", "corrections_speed", ["FAST", "OK", "SLOW"]);
      renderCounts("logistics-count-rescouted", "rescouted", ["YES", "NO"]);
    })
    .catch(() => {
      // silent fail; do not break main flow
    });
}

document.getElementById("btn-first").onclick = () => fetchPage(1);
document.getElementById("btn-prev").onclick = () => fetchPage(Math.max(1, currentPage - 1));
document.getElementById("btn-next").onclick = () => fetchPage(Math.min(totalPages, currentPage + 1));
document.getElementById("btn-last").onclick = () => fetchPage(totalPages || 1);

filterableColumns.forEach(col => {
  const input = document.getElementById("filter-" + col);
  if (input) {
    input.addEventListener("change", () => {
      trackFilterSelection(col);
      fetchPage(1);
    });
  }
});

extraFilterColumns.forEach(col => {
  const input = document.getElementById("filter-" + col);
  if (input) {
    input.addEventListener("change", () => {
      if (col === "competition") {
        syncPhaseFilterState();
        syncGroupFilterState();
      }
      if (col === "phase") {
        input.value = normalizePhaseValue(input.value);
      }
      trackFilterSelection(col);
      fetchPage(1);
    });
  }
});

// game-level filters: listen to changes (only on commit, not every keystroke)
gameFilterColumns.forEach(col => {
  const input = document.getElementById("filter-" + col);
  if (input) {
    input.addEventListener("change", () => {
      if (col === "group") {
        input.value = normalizeGroupValue(input.value);
      }
      trackFilterSelection(col);
      fetchPage(1);
      updateLogisticsCounts();
    });
  }
});

const clearGameBtn = document.getElementById("clear-game-filters");
if (clearGameBtn) {
  clearGameBtn.addEventListener("click", () => {
    [...gameTopFilterColumns, ...gameFilterColumns].forEach(col => clearFilter(col));
    selectedFilterOrder = selectedFilterOrder.filter(col => ![...gameTopFilterColumns, ...gameFilterColumns].includes(col));
    syncPhaseFilterState();
    syncGroupFilterState();
    fetchPage(1);
    updateLogisticsCounts();
  });
}

const clearCorrectionsBtn = document.getElementById("clear-corrections-filters");
if (clearCorrectionsBtn) {
  clearCorrectionsBtn.addEventListener("click", () => {
    const allCols = [...filterableColumns];
    allCols.forEach(col => clearFilter(col));
    selectedFilterOrder = selectedFilterOrder.filter(col => !allCols.includes(col));
    fetchPage(1);
  });
}

const exportBtn = document.getElementById("export-corrections-excel");
if (exportBtn) {
  exportBtn.addEventListener("click", () => {
    if (!Number(total)) {
      showExportWarningModal(true);
      return;
    }
    const params = getFilterParams();
    params.delete("page");
    params.delete("per_page");
    window.location.href = "/api/corrections_export.xlsx?" + params.toString();
  });
}

const exportBssBtn = document.getElementById("export-bss-excel");
if (exportBssBtn) {
  exportBssBtn.addEventListener("click", () => {
    if (!Number(total)) {
      showExportWarningModal(true);
      return;
    }
    const params = getFilterParams();
    params.delete("page");
    params.delete("per_page");
    params.set("breakdown", "b_ss");
    window.location.href = "/api/corrections_export.xlsx?" + params.toString();
  });
}

const exportQuarterBtn = document.getElementById("export-quarter-excel");
if (exportQuarterBtn) {
  exportQuarterBtn.addEventListener("click", () => {
    if (!Number(total)) {
      showExportWarningModal(true);
      return;
    }
    const params = getFilterParams();
    params.delete("page");
    params.delete("per_page");
    params.set("breakdown", "quarter");
    window.location.href = "/api/corrections_export.xlsx?" + params.toString();
  });
}

const exportTeamBtn = document.getElementById("export-team-excel");
if (exportTeamBtn) {
  exportTeamBtn.addEventListener("click", () => {
    if (!Number(total)) {
      showExportWarningModal(true);
      return;
    }
    const params = getFilterParams();
    params.delete("page");
    params.delete("per_page");
    params.set("breakdown", "team");
    window.location.href = "/api/corrections_export.xlsx?" + params.toString();
  });
}

const exportCategoryBtn = document.getElementById("export-category-excel");
if (exportCategoryBtn) {
  exportCategoryBtn.addEventListener("click", () => {
    if (!Number(total)) {
      showExportWarningModal(true);
      return;
    }
    const params = getFilterParams();
    params.delete("page");
    params.delete("per_page");
    params.set("breakdown", "category");
    window.location.href = "/api/corrections_export.xlsx?" + params.toString();
  });
}

const exportLgmBtn = document.getElementById("export-lgm-excel");
if (exportLgmBtn) {
  exportLgmBtn.addEventListener("click", () => {
    if (!Number(total)) {
      showExportWarningModal(true);
      return;
    }
    const params = getFilterParams();
    params.delete("page");
    params.delete("per_page");
    params.set("breakdown", "live_game_manager");
    window.location.href = "/api/corrections_export.xlsx?" + params.toString();
  });
}

const exportTypeCategoryBtn = document.getElementById("export-type-category-excel");
if (exportTypeCategoryBtn) {
  exportTypeCategoryBtn.addEventListener("click", () => {
    if (!Number(total)) {
      showExportWarningModal(true);
      return;
    }
    const params = getFilterParams();
    params.delete("page");
    params.delete("per_page");
    params.set("breakdown", "type_c_category");
    window.location.href = "/api/corrections_export.xlsx?" + params.toString();
  });
}

const closeExportWarningBtn = document.getElementById("close-export-warning");
if (closeExportWarningBtn) {
  closeExportWarningBtn.addEventListener("click", () => showExportWarningModal(false));
}

const exportWarningModal = document.getElementById("export-warning-modal");
if (exportWarningModal) {
  exportWarningModal.addEventListener("click", (event) => {
    if (event.target === exportWarningModal) showExportWarningModal(false);
  });
}

document.querySelectorAll(".filter-clear").forEach(btn => {
  const col = btn.getAttribute("data-col");
  if (!col) return;
  btn.addEventListener("click", () => {
    clearFilter(col);
    selectedFilterOrder = selectedFilterOrder.filter(c => c !== col);
    if (col === "competition") {
      syncPhaseFilterState();
      syncGroupFilterState();
    }
    fetchPage(1);
  });
});

loadFilterLiveGameManagers();
loadTeamCodes();
loadAllUscs();
syncPhaseFilterState();
syncGroupFilterState();

const homeTeamInput = document.getElementById("filter-home_team");
if (homeTeamInput) {
  homeTeamInput.addEventListener("change", () => {
    fetchPage(1);
    updateLogisticsCounts();
  });
}

fetchPage(1);
updateLogisticsCounts();
</script>

<footer class="app-version-footer">Version {{ app_version }}</footer>
</body>
</html>
