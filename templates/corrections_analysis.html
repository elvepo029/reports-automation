<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Corrections analysis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 20px; color: #0A1F44; }
    .back-link { margin-bottom: 12px; }
    .back-link a { color: #1B5DBF; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    h2 {
      color: #0A1F44;
      margin-bottom: 4px;
    }
    .filters-block-wrap {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .filters-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .filters-block-title {
      font-size: 14px;
      font-weight: 600;
      color: #0A1F44;
      margin: 0;
    }
    .filters-block-header button {
      background: #e0e4ec;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #0A1F44;
    }
    .filters-block-header button:hover {
      background: #d0d6e6;
    }
    .filters-block-wrap .filters {
      margin-bottom: 0;
      padding: 0;
    }
    .pagination {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .pagination button {
      background: #1B5DBF;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
    }
    .pagination button:hover:not(:disabled) { background: #3A7DD3; }
    .pagination button:disabled { background: #999; cursor: not-allowed; }
    .pagination span { font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table {
      border-collapse: separate;
      border-spacing: 6px;
      width: 100%;
      margin-top: 8px;
      background: #f0f2f5;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    th { background: #0A1F44; color: white; position: sticky; top: 0; z-index: 2; white-space: nowrap; border-color: #0A1F44; }
    tbody tr:nth-child(even) td { background-color: #f8faff; }
    tbody tr:hover td { background-color: #e6f0ff; }
    #loading { margin: 6px 0 8px 0; color: #666; }
    #error { margin: 16px 0; color: #c00; }
    .filters {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      row-gap: 12px;
      column-gap: 32px;
      align-items: end;
    }
    .filters label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; color: #0A1F44; }
    .filters input,
    .filters select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      background: white;
      font-size: 14px;
    }
    .filter-count { margin: 12px 0; font-weight: 600; color: #0A1F44; }
    .filters-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .filters-toolbar button {
      background: #e0e4ec;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #0A1F44;
    }
    .filters-toolbar button:hover {
      background: #d0d6e6;
    }
    .filter-field {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .filter-clear {
      background: #f0f2f5;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      color: #555;
      white-space: nowrap;
    }
    .filter-clear:hover {
      background: #e2e6f0;
    }

    /* Filter container width – unified for all filters */
    .filter-container {
      width: 245px;
      box-sizing: border-box;
    }
    .logistics-count {
      margin-top: 4px;
      font-size: 11px;
      color: #555;
      line-height: 1.2;
    }
    /* Forcing a break between rows inside the game filters grid */
    #game-filters .filters-row-break {
      grid-column: 1 / -1;
      height: 0;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>

<script>
const PER_PAGE = 10;
const displayColumns = [
  "game_code", "time", "quarter", "points_h", "points_a", "action_num",
  "b_ss", "team", "type_c", "category", "thread_name", "correction", "live_game_manager"
];
const filterableColumns = [
  "game_code", "time", "quarter", "points_h", "points_a", "action_num",
  "b_ss", "team", "type_c", "category", "live_game_manager"
];
// filters that live in the Game table (home/away, USCs, logistics)
const gameFilterColumns = [
  "home_team", "away_team",
  "data_entry", "caller_1", "caller_2", "timer",
  "shot_clock_operator", "irs_operator",
  "arrival_time", "checklist_on_time", "communication",
  "corrections_speed", "rescouted"
];
const extraFilterColumns = ["competition", "season"];
const gameTopFilterColumns = ["competition", "season", "game_code"];

let currentPage = 1;
let totalPages = 0;
let total = 0;
let teamCodeToName = {};

function showLoading(show) {
  document.getElementById("loading").style.display = show ? "block" : "none";
}
function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
}
function showTable(show) {
  document.getElementById("table-wrap").style.display = show ? "block" : "none";
}
function showFilterCount(show) {
  const el = document.getElementById("filter-count");
  el.style.display = show ? "block" : "none";
}

function getFilterParams() {
  const params = new URLSearchParams({ page: String(currentPage), per_page: String(PER_PAGE) });
  // standard equality filters
  filterableColumns.forEach(col => {
    const input = document.getElementById("filter-" + col);
    if (input && input.value.trim()) params.set(col, input.value.trim());
  });
  // game-level filters (Game table)
  gameFilterColumns.forEach(col => {
    const input = document.getElementById("filter-" + col);
    if (input && input.value.trim()) params.set(col, input.value.trim());
  });

  // extra virtual filters (competition, season)
  const competitionEl = document.getElementById("filter-competition");
  if (competitionEl && competitionEl.value) {
    params.set("competition", competitionEl.value);
  }
  const seasonEl = document.getElementById("filter-season");
  if (seasonEl && seasonEl.value) {
    params.set("season", seasonEl.value);
  }
  return params;
}

function fetchPage(page) {
  currentPage = page;
  showLoading(true);
  showError("");
  const params = getFilterParams();
  params.set("page", String(page));
  fetch("/api/corrections?" + params)
    .then(r => r.json())
    .then(data => {
      showLoading(false);
      total = data.total;
      totalPages = data.total_pages;
      currentPage = data.page;
      renderTable(data.items);
      renderPagination();
      renderFilterCount({
        denom_total: data.denom_total,
        percent_of_total: data.percent_of_total,
        percent_scope: data.percent_scope,
      });
      showTable(true);
      showFilterCount(true);
    })
    .catch(err => {
      showLoading(false);
      showError("Error loading data: " + err.message);
      showTable(false);
      showFilterCount(false);
    });
}

function renderFilterCount(extra) {
  const countEl = document.getElementById("filter-count-text");
  const pctEl = document.getElementById("filter-percent-text");
  if (countEl) {
    countEl.textContent = "Number of records with selected filters: " + total;
  }
  if (!pctEl) return;
  if (!extra || !extra.denom_total) {
    pctEl.textContent = "";
    return;
  }
  const pct = typeof extra.percent_of_total === "number"
    ? extra.percent_of_total
    : 0;
  if (extra.percent_scope === "home_team_with_selected_uscs") {
    const homeCode = (document.getElementById("filter-home_team")?.value || "").trim();
    const teamName = (homeCode && teamCodeToName[homeCode]) ? teamCodeToName[homeCode] : (homeCode || "home team");

    const uscLabels = {
      data_entry: "data entry",
      caller_1: "caller 1",
      caller_2: "caller 2",
      timer: "timer",
      shot_clock_operator: "shot clock operator",
      irs_operator: "IRS operator",
    };
    const uscFields = ["data_entry","caller_1","caller_2","timer","shot_clock_operator","irs_operator"];
    const parts = [];
    uscFields.forEach(f => {
      const v = (document.getElementById("filter-" + f)?.value || "").trim();
      if (v) parts.push(`${v} as ${uscLabels[f]}`);
    });
    const withText = parts.length ? (" with " + parts.join(" and ")) : "";

    pctEl.textContent = `${pct.toFixed(1)}% of ${teamName} corrections${withText}`;
  } else {
    pctEl.textContent = `${pct.toFixed(1)}% of total corrections`;
  }
}

function renderTable(items) {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "";
  tbody.innerHTML = "";

  const headerRow = document.createElement("tr");
  displayColumns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);

  items.forEach(row => {
    const tr = document.createElement("tr");
    displayColumns.forEach(col => {
      const td = document.createElement("td");
      const val = row[col];
      td.textContent = val != null && val !== "" ? String(val) : "";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function renderPagination() {
  document.getElementById("page-info").textContent =
    "Page " + currentPage + " of " + (totalPages || 1) + " (" + total + " total records)";
  document.getElementById("btn-first").disabled = currentPage <= 1;
  document.getElementById("btn-prev").disabled = currentPage <= 1;
  document.getElementById("btn-next").disabled = currentPage >= totalPages || totalPages === 0;
  document.getElementById("btn-last").disabled = currentPage >= totalPages || totalPages === 0;
}

function clearFilter(col) {
  const el = document.getElementById("filter-" + col);
  if (!el) return;
  if (el.tagName === "SELECT") {
    el.value = "";
  } else {
    el.value = "";
  }
}

function loadFilterLiveGameManagers() {
  const datalist = document.getElementById("datalist_live_game_manager");
  if (!datalist) return;
  fetch("/get_live_game_managers")
    .then(r => r.json())
    .then(data => {
      datalist.innerHTML = "";
      data.forEach(lgm => {
        const option = document.createElement("option");
        option.value = lgm;
        datalist.appendChild(option);
      });
    })
    .catch(() => {
      datalist.innerHTML = "";
    });
}

function loadTeamCodes() {
  const datalist = document.getElementById("datalist_team_codes");
  if (!datalist) return;
  fetch("/api/teams")
    .then(r => r.json())
    .then(data => {
      datalist.innerHTML = "";
      teamCodeToName = {};
      data.forEach(row => {
        const code = row.team_code;
        const name = row.team_name;
        if (code) teamCodeToName[code] = name || "";
        const opt = document.createElement("option");
        opt.value = code;
        datalist.appendChild(opt);
      });
    });
}

function loadUscsForTeam(teamCode) {
  const datalistIds = [
    "datalist_data_entry",
    "datalist_caller_1",
    "datalist_caller_2",
    "datalist_timer",
    "datalist_shot_clock_operator",
    "datalist_irs_operator",
  ];
  datalistIds.forEach(id => {
    const datalist = document.getElementById(id);
    if (!datalist) return;
    datalist.innerHTML = "";
  });
  if (!teamCode) return;
  fetch("/api/uscs_for_team/" + encodeURIComponent(teamCode))
    .then(r => r.json())
    .then(names => {
      datalistIds.forEach(id => {
        const datalist = document.getElementById(id);
        if (!datalist) return;
        names.forEach(name => {
          const opt = document.createElement("option");
          opt.value = name;
          datalist.appendChild(opt);
        });
      });
    });
}

function updateLogisticsCounts() {
  const params = new URLSearchParams();
  gameFilterColumns.forEach(col => {
    const el = document.getElementById("filter-" + col);
    if (el && el.value.trim()) {
      params.set(col, el.value.trim());
    }
  });
  fetch("/api/logistics_counts?" + params.toString())
    .then(r => r.json())
    .then(data => {
      // helper to render % under each logistics filter (over total for that field)
      function renderCounts(containerId, fieldName, orderedValues) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const counts = data[fieldName] || {};
        let total = 0;
        Object.values(counts).forEach(c => { total += c; });
        if (!Object.keys(counts).length || total === 0) {
          container.textContent = "";
          return;
        }
        const parts = [];
        orderedValues.forEach(v => {
          const c = counts[v] || 0;
          const pct = Math.round((c / total) * 100);
          parts.push(`${v}: ${pct}%`);
        });
        container.textContent = parts.join(" · ") + (total ? `   (${total})` : "");
      }

      renderCounts("logistics-count-arrival_time", "arrival_time", ["Ok", "Late"]);
      renderCounts("logistics-count-checklist_on_time", "checklist_on_time", ["Yes", "No"]);
      renderCounts("logistics-count-communication", "communication", ["Good", "Ok", "Not Fluid"]);
      renderCounts("logistics-count-corrections_speed", "corrections_speed", ["Fast", "Ok", "Slow"]);
      renderCounts("logistics-count-rescouted", "rescouted", ["Yes", "No"]);
    })
    .catch(() => {
      // silent fail; do not break main flow
    });
}

document.getElementById("btn-first").onclick = () => fetchPage(1);
document.getElementById("btn-prev").onclick = () => fetchPage(Math.max(1, currentPage - 1));
document.getElementById("btn-next").onclick = () => fetchPage(Math.min(totalPages, currentPage + 1));
document.getElementById("btn-last").onclick = () => fetchPage(totalPages || 1);

filterableColumns.forEach(col => {
  const input = document.getElementById("filter-" + col);
  if (input) {
    input.addEventListener("change", () => fetchPage(1));
  }
});

extraFilterColumns.forEach(col => {
  const input = document.getElementById("filter-" + col);
  if (input) {
    input.addEventListener("change", () => fetchPage(1));
  }
});

// game-level filters: listen to changes (only on commit, not every keystroke)
gameFilterColumns.forEach(col => {
  const input = document.getElementById("filter-" + col);
  if (input) {
    input.addEventListener("change", () => {
      fetchPage(1);
      updateLogisticsCounts();
    });
  }
});

const clearGameBtn = document.getElementById("clear-game-filters");
if (clearGameBtn) {
  clearGameBtn.addEventListener("click", () => {
    [...gameTopFilterColumns, ...gameFilterColumns].forEach(col => clearFilter(col));
    fetchPage(1);
    updateLogisticsCounts();
  });
}

const clearCorrectionsBtn = document.getElementById("clear-corrections-filters");
if (clearCorrectionsBtn) {
  clearCorrectionsBtn.addEventListener("click", () => {
    const allCols = [...filterableColumns];
    allCols.forEach(col => clearFilter(col));
    fetchPage(1);
  });
}

document.querySelectorAll(".filter-clear").forEach(btn => {
  const col = btn.getAttribute("data-col");
  if (!col) return;
  btn.addEventListener("click", () => {
    clearFilter(col);
    fetchPage(1);
  });
});

loadFilterLiveGameManagers();
loadTeamCodes();

const homeTeamInput = document.getElementById("filter-home_team");
if (homeTeamInput) {
  homeTeamInput.addEventListener("change", () => {
    loadUscsForTeam(homeTeamInput.value.trim() || "");
    fetchPage(1);
    updateLogisticsCounts();
  });
}

fetchPage(1);
updateLogisticsCounts();
</script>

</body>
