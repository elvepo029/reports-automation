<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reports automation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      margin: 40px;
      color: #0A1F44;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    h1 {
      color: #0A1F44;
      margin-bottom: 2rem;
    }
    .nav-cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-card {
      display: block;
      padding: 32px 48px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      text-decoration: none;
      color: #0A1F44;
      font-weight: 600;
      font-size: 1.1rem;
      transition: box-shadow 0.2s, transform 0.2s;
      border: 1px solid #e0e0e0;
    }
    .nav-card:hover {
      box-shadow: 0 4px 20px rgba(27, 93, 191, 0.2);
      transform: translateY(-2px);
      border-color: #1B5DBF;
    }
  </style>
</head>
<body>
  <h1>Reports automation</h1>
  <div class="nav-cards">
    <a class="nav-card" href="/report-generator">Report generator</a>
    <a class="nav-card" href="/corrections-analysis">Corrections analysis</a>
  </div>
</body>
</html>
