<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Correccions Eurolliga</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 20px; color: #0A1F44; }
  h2 { color: #0A1F44; }
  label { font-weight: 600; margin-right: 5px; }
  input, select, textarea {
    padding: 8px 12px; font-size: 16px;
    border-radius: 6px; border: 1px solid #ccc; margin-right: 8px; margin-bottom: 10px;
    outline: none; transition: border 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: #1B5DBF; }
  textarea { width: 100%; min-height: 80px; resize: vertical; }
  button {
    background: #1B5DBF; color: white; border: none; padding: 8px 16px;
    border-radius: 5px; cursor: pointer; transition: background 0.2s; margin-top: 5px;
  }
  button:hover { background: #3A7DD3; }
  #status { font-weight: bold; margin-left: 10px; }
  table {
    border-collapse: collapse; width: 100%; margin-top: 15px; background: white;
    border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  th, td { border-bottom: 1px solid #e0e0e0; padding: 10px; text-align: center; font-size: 14px; }
  th { background: #0A1F44; color: white; position: sticky; top: 0; z-index: 2; }
  tr:nth-child(even) { background-color: #f8faff; }
  tr:hover { background-color: #e6f0ff; }
  td[contenteditable="true"] { background-color: #fffde6; border-radius: 4px; }
  td[contenteditable="true"]:focus { outline: 2px solid #1B5DBF; }
  .field-group { margin-top: 15px; }
</style>
</head>
<body>

<h2>Correccions per Game Code</h2>

<!-- Selecció live_game_manager, competició i número de partit -->
<label>Live Game Manager:</label>
<select id="live_game_manager_select">
  <option value="">Carregant...</option>
</select>

<label>Competició:</label>
<select id="competition">
  <option value="E">Euroleague</option>
  <option value="U">Eurocup</option>
</select>

<label>Num partit:</label>
<input id="match_num" placeholder="Ex: 130">

<button onclick="loadData()">Carregar</button>
<span id="status"></span>

<button onclick="runCorrection()">Generar Correccions</button>

<!-- Taula correccions -->
<table id="table"></table>

<!-- Camps per generar report -->
<div class="field-group" id="report-fields" style="display:none">
  <label>Data Entry:</label>
  <input type="text" id="data_entry" list="usc_list">
  
  <label>Caller 1:</label>
  <input type="text" id="caller_1" list="usc_list">
  
  <label>Caller 2:</label>
  <input type="text" id="caller_2" list="usc_list">
  
  <label>Timer:</label>
  <input type="text" id="timer" list="usc_list">
  
  <label>Shot Clock Operator:</label>
  <input type="text" id="shot_clock_operator" list="usc_list">
  
  <label>IRS Operator:</label>
  <input type="text" id="irs_operator" list="usc_list">

  <datalist id="usc_list"></datalist>
</div>

<div class="field-group" id="num-accions-field" style="display:none">
  <label>Num accions del partit:</label>
  <input id="num_accions" placeholder="Ex: 120">
</div>

<div class="field-group" id="logistics-fields" style="display:none">
  <h3>Logistics</h3>

  <label>Arrival Time:</label>
  <select id="arrival_time">
    <option value="">Selecciona</option>
    <option value="Ok">Ok</option>
    <option value="Late">Late</option>
  </select>

  <label>Check List On Time:</label>
  <select id="checklist_on_time">
    <option value="">Selecciona</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <label>Communication:</label>
  <select id="communication">
    <option value="">Selecciona</option>
    <option value="Good">Good</option>
    <option value="Ok">Ok</option>
    <option value="Not Fluid">Not Fluid</option>
  </select>

  <label>Corrections:</label>
  <select id="corrections_speed">
    <option value="">Selecciona</option>
    <option value="Fast">Fast</option>
    <option value="Ok">Ok</option>
    <option value="Slow">Slow</option>
  </select>

  <label>Rescouted:</label>
  <select id="rescouted">
    <option value="">Selecciona</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>
</div>

<div class="field-group" id="comentari-field" style="display:none">
  <label>Comentari:</label>
  <textarea id="valoracions" placeholder="Introdueix aquí el comentari..."></textarea>
  <small id="contador">0 / 150 paraules</small>
  <p id="missatge" style="display:none; color:red;">
    Has arribat al límit màxim de paraules.
  </p>
</div>

<button onclick="generateReport()" id="generate-report-btn" style="display:none">Generar Report</button>

<script>
const textarea = document.getElementById("valoracions");
const contador = document.getElementById("contador");
const missatge = document.getElementById("missatge");
const maxParaules = 150;

textarea.addEventListener("input", () => {
  let paraules = textarea.value
    .trim()
    .split(/\s+/)
    .filter(p => p.length > 0);

  if (paraules.length > maxParaules) {
    textarea.value = paraules.slice(0, maxParaules).join(" ");
    textarea.blur(); // treu el focus del camp
    missatge.style.display = "block";
  } else {
    missatge.style.display = "none";
  }

  contador.textContent = `${paraules.length} / ${maxParaules} paraules`;
});

const nonEditableColumns = ["game_code", "thread_name", "correction"];
const columnOrder = ["thread_name","correction","time","quarter","points_h","points_a","action_num","b_ss","team","type_c","category"];
let currentData = [];

loadLiveGameManagers();

function loadData() {
  const comp = document.getElementById("competition").value;
  const num = document.getElementById("match_num").value.trim();
  const lgm = document.getElementById("live_game_manager_select").value;
  if (!lgm) { alert("Selecciona un Live Game Manager"); return; }
  if (!num) { alert("Introdueix un número de partit"); return; }
  const gameCode = `${comp}2025_${num}`;

  fetch(`/corrections/${gameCode}`)
    .then(r => r.json())
    .then(data => { 
      currentData = data; 
      renderTable(data, lgm);  // Passem el Live Game Manager seleccionat

      // Només mostrar el formulari d’afegir correcció si totes les correccions pertanyen al mateix LGM
      const canEdit = data.every(row => row.live_game_manager === lgm || row.live_game_manager === null);

      const reportInputs = [
        "data_entry",
        "caller_1",
        "caller_2",
        "timer",
        "shot_clock_operator",
        "irs_operator",
        "num_accions",
        "valoracions", 
        "arrival_time",
        "checklist_on_time", 
        "communication",
        "corrections_speed"
      ];

      reportInputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = !canEdit;
      });

      // Mostrem la resta dels camps sempre (per visualitzar report)
      document.getElementById("report-fields").style.display = "block";
      document.getElementById("num-accions-field").style.display = "block";
      document.getElementById("comentari-field").style.display = "block";
      document.getElementById("generate-report-btn").style.display = "inline-block";
    });

  fetch(`/get_uscs_for_game/${gameCode}`)
    .then(r => r.json())
    .then(names => {
      
      const datalist = document.getElementById("usc_list");
      datalist.innerHTML = "";

      names.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        datalist.appendChild(option);
      })
    });

    document.getElementById("logistics-fields").style.display = "block";
}

function renderTable(data, selectedLGM) {
  const table = document.getElementById("table");
  table.innerHTML = "";

  // HEADER
  const headerRow = table.insertRow();
  columnOrder.forEach(col => {
    const th = document.createElement("th");
    th.innerText = col;
    headerRow.appendChild(th);
  });
  const thBtn = document.createElement("th");
  thBtn.innerText = "Accions";
  headerRow.appendChild(thBtn);

  // FILA NOVA (SEMPRE)
  insertNewCorrectionRow(table, selectedLGM);

  // SI NO HI HA DADES → ja n’hi ha prou
  if (!data || data.length === 0) {
    return;
  }

  data.forEach(row => {
    const tr = table.insertRow();
    const canEditRow = row.live_game_manager === selectedLGM || row.live_game_manager === null;

    columnOrder.forEach(col => {
      const td = tr.insertCell();
      td.innerText = row[col] || "";
      if (!nonEditableColumns.includes(col) && canEditRow) td.contentEditable = "true";
      else td.contentEditable = "false";
    });

    const tdAction = tr.insertCell();
    const btnSave = document.createElement("button");
    btnSave.innerText = "Guardar";
    btnSave.disabled = !canEditRow;

    btnSave.onclick = () => saveRow(row, tr);

    const btnDelete = document.createElement("button");
    btnDelete.innerText = "Eliminar";
    btnDelete.style.background = "#E30613";
    btnDelete.style.marginLeft = "5px";
    btnDelete.disabled = !canEditRow;
    btnDelete.onclick = () => deleteRow(row.rowid);

    tdAction.appendChild(btnSave);
    tdAction.appendChild(btnDelete);

    if (!canEditRow) {
      btnSave.style.background = "#999";
      btnSave.style.cursor = "not-allowed";

      btnDelete.style.background = "#999";
      btnDelete.style.cursor = "not-allowed";
    }
  });
}

function insertNewCorrectionRow(table, selectedLGM) {
  const tr = table.insertRow(1); // just sota el header
  tr.style.background = "#fffbe6";

  const newData = {};

  columnOrder.forEach(col => {
    const td = tr.insertCell();
    td.dataset.field = col;

    if (col === "thread_name" || col === "correction") {
      td.innerText = "Correcció Nova";
      td.contentEditable = "false";
    } else {
      td.innerText = "";
      td.contentEditable = !nonEditableColumns.includes(col);
    }
  });

  const tdActions = tr.insertCell();

  const btnAdd = document.createElement("button");
  btnAdd.innerText = "Afegir";

  btnAdd.onclick = () => {
    const cells = tr.querySelectorAll("td[data-field]");
    cells.forEach(td => {
      newData[td.dataset.field] = td.innerText.trim();
    });

    newData.live_game_manager = selectedLGM;

    addCorrectionFromRow(newData);
  };

  const btnDiscard = document.createElement("button");
  btnDiscard.innerText = "Descartar";
  btnDiscard.style.background = "#E30613";
  btnDiscard.style.marginLeft = "5px";

  btnDiscard.onclick = () => {
    tr.querySelectorAll("td[data-field]").forEach(td => {
      const field = td.dataset.field;

      if (field === "thread_name" || field === "correction") {
        td.innerText = "Correcció Nova";
      } else {
        td.innerText = "";
      }
    });
  };

  tdActions.appendChild(btnAdd);
  tdActions.appendChild(btnDiscard);
}


function saveRow(rowData, tr) {
  const newData = { rowid: rowData.rowid };
  columnOrder.forEach(col => { if (!nonEditableColumns.includes(col)) newData[col] = tr.cells[columnOrder.indexOf(col)].innerText; });
  fetch("/update", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(newData) })
    .then(r => r.json())
    .then(res => {
      const status = document.getElementById("status");
      if (res.status === "ok") { status.innerText = "Fila guardada correctament ✅"; setTimeout(() => status.innerText = "", 2000); }
      else { status.innerText = "Error al guardar ❌"; }
    });
}

function deleteRow(rowid) {
  if (!confirm("Segur que vols eliminar aquesta correcció? Aquesta acció no es pot desfer.")) {
    return;
  }

  fetch(`/delete_correction/${rowid}`, {
    method: "DELETE"
  })
  .then(r => r.json())
  .then(res => {
    if (res.status === "ok") {
      alert("Correcció eliminada correctament");
      loadData(); // recarregar taula
    } else {
      alert("Error eliminant la correcció");
    }
  });
}

function addCorrectionFromRow(rowData) {
  const comp = document.getElementById("competition").value;
  const num = document.getElementById("match_num").value.trim();
  const lgm = document.getElementById("live_game_manager_select").value;

  if (!lgm) { alert("Selecciona un Live Game Manager"); return; }
  if (!num) { alert("Introdueix un número de partit"); return; }

  const gameCode = `${comp}2025_${num}`;

  const data = {
    game_code: gameCode,
    time: rowData.time || "",
    quarter: rowData.quarter || "",
    points_h: rowData.points_h || "",
    points_a: rowData.points_a || "",
    action_num: rowData.action_num || "",
    b_ss: rowData.b_ss || "",
    team: rowData.team || "",
    type_c: rowData.type_c || "",
    category: rowData.category || "",
    thread_name: "Correcció Manual",
    correction: "Correcció Manual",
    live_game_manager: lgm
  };

  fetch("/add_correction", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if (res.status === "ok") {
      loadData(); // refresca taula i neteja la fila
    } else {
      alert("Error afegint correcció");
    }
  });
}


function loadLiveGameManagers() {
  const select = document.getElementById("live_game_manager_select");
  fetch('/get_live_game_managers')
    .then(r => r.json())
    .then(data => {
      select.innerHTML = "";
      if (!data.length) {
        const option = document.createElement("option");
        option.value = "";
        option.text = "No hi ha Live Game Managers disponibles";
        select.appendChild(option);
      } else {
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.text = "Selecciona un Live Game Manager";
        select.appendChild(defaultOption);
        data.forEach(lgm => {
          const option = document.createElement("option");
          option.value = lgm;
          option.text = lgm;
          select.appendChild(option);
        });
      }
    })
    .catch(() => {
      select.innerHTML = "";
      const option = document.createElement("option");
      option.value = "";
      option.text = "Error carregant Live Game Managers";
      select.appendChild(option);
    });
}

function generateReport() {
    // 1️⃣ Recollir Game Code i LGM
    const comp = document.getElementById("competition").value;
    const num = document.getElementById("match_num").value.trim();
    const lgm = document.getElementById("live_game_manager_select").value;

    if (!num || !lgm) {
        alert("Selecciona un Live Game Manager i introdueix el número de partit");
        return;
    }

    const gameCode = `${comp}2025_${num}`;

    // 2️⃣ Recollir dades de Logistics
    const logisticsData = {
        arrival_time: document.getElementById("arrival_time").value,
        checklist_on_time: document.getElementById("checklist_on_time").value,
        communication: document.getElementById("communication").value,
        corrections_speed: document.getElementById("corrections_speed").value,
        rescouted: document.getElementById("rescouted").value
    };

    const uscs = {
      data_entry: document.getElementById("data_entry").value,
      caller_1: document.getElementById("caller_1").value,
      caller_2: document.getElementById("caller_2").value,
      timer: document.getElementById("timer").value,
      shot_clock: document.getElementById("shot_clock_operator").value,
      irs_operator: document.getElementById("irs_operator").value
    }

    // 3️⃣ Recollir num_accions
    const num_accions = document.getElementById("num_accions").value;
    if (!num_accions) {
        alert("Introdueix el número d'accions del partit");
        return;
    }

    // Recollir comentari de Final Valorations
    const valoracions = document.getElementById("valoracions").value;

    // 4️⃣ Validació simple de Logistics
    for (const key in logisticsData) {
        if (!logisticsData[key]) {
            alert(`Omple el camp: ${key.replace("_", " ")}`);
            return;
        }
    }

    // 5️⃣ Construir URL amb query params
    const params = new URLSearchParams({
        ...logisticsData,
        num_accions: num_accions,
        valoracions: valoracions, 
        ...uscs
    }).toString();

    // 6️⃣ Obrir PDF en una nova finestra
    window.open(`/generate_report/${gameCode}/${lgm}?${params}`, '_blank');
}

function runCorrection() {
  fetch("/run-correction", { method: "POST" })
    .then(r => r.json())
    .then(res => {
      if (res.status === "ok") {
        alert("Script executat correctament");
      } else {
        alert("Error: " + res.message);
      }
    });
}

</script>

</body>
</html>
